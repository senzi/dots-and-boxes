<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 米白圆角底 -->
  <rect width="64" height="64" rx="14" fill="#f5f5f5"/>
  <!-- 大气渐变光晕（ElevenLabs 调性） -->
  <circle cx="13" cy="12" r="20" fill="#a7e5d3" opacity="0.4"/>
  <circle cx="52" cy="54" r="20" fill="#c8b8e0" opacity="0.35"/>

  <!-- 5×5 点阵：边距 14，间距 9 -->
  <g fill="#292524">
    <circle cx="14" cy="14" r="2.6"/><circle cx="23" cy="14" r="2.6"/><circle cx="32" cy="14" r="2.6"/><circle cx="41" cy="14" r="2.6"/><circle cx="50" cy="14" r="2.6"/>
    <circle cx="14" cy="23" r="2.6"/><circle cx="23" cy="23" r="2.6"/><circle cx="32" cy="23" r="2.6"/><circle cx="41" cy="23" r="2.6"/><circle cx="50" cy="23" r="2.6"/>
    <circle cx="14" cy="32" r="2.6"/><circle cx="23" cy="32" r="2.6"/><circle cx="32" cy="32" r="2.6"/><circle cx="41" cy="32" r="2.6"/><circle cx="50" cy="32" r="2.6"/>
    <circle cx="14" cy="41" r="2.6"/><circle cx="23" cy="41" r="2.6"/><circle cx="32" cy="41" r="2.6"/><circle cx="41" cy="41" r="2.6"/><circle cx="50" cy="41" r="2.6"/>
    <circle cx="14" cy="50" r="2.6"/><circle cx="23" cy="50" r="2.6"/><circle cx="32" cy="50" r="2.6"/><circle cx="41" cy="50" r="2.6"/><circle cx="50" cy="50" r="2.6"/>
  </g>

  <!-- 已围中心格（P2 青绿淡底） -->
  <rect x="23" y="23" width="9" height="9" fill="#4f8f7f" opacity="0.35"/>
  <g stroke="#292524" stroke-width="1.8" stroke-linecap="round">
    <line x1="23" y1="23" x2="32" y2="23"/>
    <line x1="23" y1="32" x2="32" y2="32"/>
    <line x1="23" y1="23" x2="23" y2="32"/>
    <line x1="32" y1="23" x2="32" y2="32"/>
  </g>

  <!-- 装饰：几条未完成边（hairline） -->
  <g stroke="#d6d3d1" stroke-width="1.6" stroke-linecap="round">
    <line x1="14" y1="14" x2="23" y2="14"/>
    <line x1="14" y1="14" x2="14" y2="23"/>
    <line x1="41" y1="14" x2="50" y2="14"/>
    <line x1="14" y1="41" x2="14" y2="50"/>
    <line x1="41" y1="50" x2="50" y2="50"/>
    <line x1="50" y1="41" x2="50" y2="50"/>
  </g>
</svg>
